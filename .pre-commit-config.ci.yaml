# CI check-only config. --force-spdx required: without it the hook only diffs vs base.

exclude: |
  (?x)
    ^target/
    ^ui/node_modules/
    ^ui/.pnpm-store/
    ^docs/

repos:

- repo: https://github.com/rapidsai/pre-commit-hooks
  rev: v1.5.1
  hooks:
    - id: verify-copyright
      args: [--force-spdx]
      exclude: |
        (?x)
          bridge/include/rust/cxx\.h$|
          bridge/include/quent-bridge/gen/|
          examples/simulator/server/ts-bindings/
      files: |
        (?x)
          CMakeLists\.txt$|
          [.](rs|js|ts|tsx|jsx|mjs|cjs|py|sh|cpp|h|proto|css)$
