services:
  server:
    build:
      context: ../../..
      dockerfile: experimental/vibe/simulator/Dockerfile
    image: quent-simulator-example
    ports:
      - "8080:8080"
    restart: unless-stopped
    command: "/quent/quent-simulator-server --log-level debug"

  simulator:
    image: quent-simulator-example
    depends_on:
      - server
    restart: "no"
    environment:
      QUENT_COLLECTOR_ADDRESS: "http://server:7836"
    command: "/quent/quent-simulator --num-query-groups 1 --num-queries 1 --num-workers 4 --num-threads 8 --num-tasks 64"

  mcp:
    image: quent-simulator-example
    depends_on:
      - server
    ports:
      - "8081:8081"
    restart: unless-stopped
    command:
      - "/quent/quent-mcp"
      - "--transport"
      - "http"
      - "--api-base"
      - "http://server:8080/api"
      - "--listen"
      - "0.0.0.0:8081"