services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: quent
    container_name: quent-simulator-server
    ports:
      - "8080:8080"
      - "7836:7836"
    restart: unless-stopped
    volumes:
      - ./data:/quent/data
    environment:
      QUENT_ANALYZER_CORS_ADDRESS: "http://localhost:5173,http://localhost:3000"
    command: "/quent/quent-simulator-server --log-level debug --cors-address http://localhost:5173,http://localhost:3000"

  simulator:
    image: quent
    container_name: quent-simulator
    depends_on:
      - server
    restart: "no"
    environment:
      QUENT_COLLECTOR_ADDRESS: "http://server:7836"
    command: "/quent/quent-simulator --num-query-groups 2 --num-queries 2 --num-workers 2 --num-threads 2 --num-tasks 128"

  mcp:
    image: quent
    container_name: quent-mcp
    depends_on:
      - server
    ports:
      - "8081:8081"
    restart: unless-stopped
    command:
      - "/quent/quent-mcp"
      - "--transport"
      - "http"
      - "--api-base"
      - "http://server:8080/api"
      - "--listen"
      - "0.0.0.0:8081"
